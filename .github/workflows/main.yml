name: FB to TG Autopost
on:
  schedule:
    - cron: '*/30 * * * *' # Запуск каждый час. Можно чаще: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает право боту обновлять posted_ids.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests facebook-page-scraper
          # Установка драйвера для скрейпинга
          sudo apt-get update
          sudo apt-get install -y firefox-geckodriver

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python script.py

      - name: Save state
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add posted_ids.json
          git commit -m "Update posted IDs" || exit 0
          git push
